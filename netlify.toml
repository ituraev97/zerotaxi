# Деплой без сборки: публикуется корень репозитория
[build]
  publish = "."
  command = ""

# Функция lead (netlify/functions/lead.mjs) принимает заявку с сайта и
# пересылает её в Telegram. Секреты (TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID)
# заданы в настройках проекта на Netlify, в репозитории их нет и быть не должно.
[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
