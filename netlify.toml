# Деплой без сборки: публикуется корень репозитория
[build]
  publish = "."
  command = ""

# Функция submission-created пересылает заявки из Netlify Forms в Telegram.
# Секреты (TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID) заданы в настройках проекта
# на Netlify, в репозитории их нет и быть не должно.
[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
